[supervisord]
nodaemon=true
logfile=/app/runtime/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ib-gateway]
command=bash /home/ibgateway/scripts/ibgateway-entrypoint.sh
autostart=false
autorestart=true
stderr_logfile=/app/runtime/ib-gateway.log
stdout_logfile=/app/runtime/ib-gateway.log
environment=TWS_USERID=%(ENV_IBKR_USERNAME)s,TWS_PASSWORD=%(ENV_IBKR_PASSWORD)s,TRADING_MODE=%(ENV_IBKR_TRADING_MODE)s,TWOFA_DEVICE=%(ENV_IBKR_2FA_DEVICE)s,IBKR_TOTP_SECRET=%(ENV_IBKR_TOTP_SECRET)s,TZ=America/New_York,DISPLAY=:1

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1024x768x16
autostart=false
autorestart=true
stderr_logfile=/app/runtime/xvfb.log
stdout_logfile=/app/runtime/xvfb.log

[program:vtlive-scheduler]
command=python -m vtlive scheduler
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/runtime/vtlive.log
stdout_logfile=/app/runtime/vtlive.log
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME=/app/runtime,VT_RUNTIME_DIR=/app/runtime

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
